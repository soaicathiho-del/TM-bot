name: TM Bot
on:
  workflow_dispatch:
  # Đã tắt lịch tự động — main.py (JobQueue) giờ là nguồn lịch chính,
  # chạy 24/7 trên cùng ổ đĩa với data/history.json nên luôn có bối cảnh thật.
  # Bật lại "schedule:" bên dưới CHỈ khi worker (main.py) bị sập dài hạn
  # và bạn cần gửi tay 1 lần qua "Run workflow" trên GitHub.
  #
  # schedule:
  #   - cron: '7 2 * * *'
  #   - cron: '13 8 * * *'
  #   - cron: '37 15 * * *'
jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run consolidation
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TM_DAILY_DATABASE_ID: ${{ secrets.TM_DAILY_DATABASE_ID }}
          RULES_POINT_DATABASE_ID: ${{ secrets.RULES_POINT_DATABASE_ID }}
        run: |
          python daily_consolidation.py
